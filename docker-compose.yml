services:
  spanner:
    image: gcr.io/cloud-spanner-emulator/emulator@sha256:5f71fecd6330211789b75065ade9587d67b3a6b4678e7e5408e42c22f778c63e
    ports:
      - "9010:9010" # gRPC
      - "9020:9020" # REST

  billing:
    build: .
    depends_on:
      - spanner
    environment:
      BILLING_STORE: spanner
      SPANNER_EMULATOR_HOST: spanner:9010
      SPANNER_DATABASE: projects/billing-local/instances/billing/databases/billing
      BILLING_AUTO_CREATE_DB: "true"
      BILLING_API_KEYS: dev-local-key # local development only
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "50051:50051" # gRPC
      - "8080:8080"   # REST/JSON gateway
      - "9091:9090"   # /metrics, /healthz, /readyz
    healthcheck:
      test: ["CMD", "/billing-server", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - billing

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin # local development only
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/jaeger@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "16686:16686" # UI
