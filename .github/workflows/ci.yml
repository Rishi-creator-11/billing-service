name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: buf lint
      - run: buf format --diff --exit-code
      - name: buf breaking (pull requests)
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=origin/${{ github.base_ref }},subdir=proto'

  build-test:
    runs-on: ubuntu-latest
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator:latest
        ports:
          - 9010:9010
    env:
      SPANNER_EMULATOR_HOST: localhost:9010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: tests (race, including Spanner emulator)
        run: go test -race -count=1 -v ./... | tee test.log
      - name: Spanner tests ran, not skipped
        run: "! grep -E -- '--- SKIP' test.log"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t billing-service .
