version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
      - path: cmd/
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
